<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MR ALL IN Admin</title><link rel="stylesheet" href="assets/css/style.css"></head><body>
<header class="nav"><div class="brand"><span>MR</span> ALL IN <small>ADMIN</small></div><a href="index.html">← Toko</a></header>
<main class="admin-wrap"><div class="panel"><span class="eyebrow">CONTROL CENTER</span><h1>Admin Dashboard</h1><p id="authState">Memeriksa sesi...</p><div class="stats"><div><b id="pCount">0</b><small>Produk</small></div><div><b id="sCount">0</b><small>Stok</small></div><div><b id="fCount">0</b><small>Flash Sale</small></div></div></div>

<div class="panel"><h2>Produk</h2><div id="list"></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/supabase.js"></script><script src="assets/js/admin.js"></script></body></html>
