<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MR ALL IN — Admin</title><style>
*{box-sizing:border-box}body{margin:0;background:#090a09;color:#eee;font-family:Arial}.wrap{max-width:1100px;margin:auto;padding:25px}.head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #30312b;padding-bottom:18px}.gold{color:#f4bd43}.grid{display:grid;grid-template-columns:1fr 1.4fr;gap:20px;margin-top:20px}.panel{border:1px solid #35362f;border-radius:10px;padding:18px;background:#10110f}input,select,textarea{width:100%;padding:11px;margin:7px 0 13px;background:#1b1c19;border:1px solid #3b3c35;color:#fff;border-radius:6px}button{padding:11px 15px;border:0;border-radius:6px;background:#f4bd43;font-weight:800;cursor:pointer}.danger{background:#b52e2e;color:#fff}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.item{border:1px solid #33352e;border-radius:8px;padding:12px;margin:8px 0;display:flex;justify-content:space-between;gap:10px}.muted{color:#999;font-size:12px}.sale{color:#ff765e;font-weight:800}@media(max-width:750px){.grid{grid-template-columns:1fr}.row{grid-template-columns:1fr}}
</style></head><body><div class="wrap">
<div class="head"><div><h2 class="gold">MR ALL IN — ADMIN</h2><div class="muted">Demo dashboard • login produksi akan memakai Magic Link Supabase</div></div><a href="index.html">← Lihat Toko</a></div>
<div class="grid"><div class="panel"><h3>Tambah / Edit Produk</h3><input type="hidden" id="id">
<label>Nama produk</label><input id="name">
<div class="row"><div><label>Kategori</label><select id="cat"><option>VGA</option><option>Processor</option><option>Motherboard</option><option>RAM</option><option>SSD</option><option>HDD</option><option>PSU</option><option>Casing</option><option>Monitor</option><option>Aksesoris</option><option>Paket PC</option></select></div><div><label>Stok</label><input id="stock" type="number" min="0"></div></div>
<div class="row"><div><label>Harga normal</label><input id="old" type="number"></div><div><label>Harga jual/promo</label><input id="price" type="number"></div></div>
<label>URL gambar (atau upload di bawah)</label><input id="image" placeholder="https://...">
<label>Upload gambar</label><input id="file" type="file" accept="image/*">
<label><input id="sale" type="checkbox" style="width:auto"> Flash Sale aktif</label>
<div class="row"><div><label>Mulai promo</label><input id="start" type="datetime-local"></div><div><label>Berakhir</label><input id="end" type="datetime-local"></div></div>
<button onclick="save()">💾 Simpan Produk</button> <button class="danger" onclick="resetForm()">Batal</button>
<hr><h3>Pengaturan Toko</h3><label>WhatsApp</label><input id="wa" value="6281330053178"><label>Alamat</label><input id="addr" value="Gubeng, Surabaya"><button onclick="saveSettings()">Simpan Pengaturan</button>
</div><div class="panel"><h3>📦 Produk <span id="count" class="muted"></span></h3><div id="list"></div></div></div>
</div><script>
let ps=JSON.parse(localStorage.getItem("mrallin_products")||"null")||[
{id:1,name:"ASUS Dual RTX 3060 12GB GDDR6",cat:"VGA",price:3450000,old:3699000,stock:2,sale:true},{id:2,name:"AMD Ryzen 5 5600",cat:"Processor",price:1450000,old:1599000,stock:3,sale:false},{id:3,name:"Samsung 970 EVO Plus 1TB",cat:"SSD",price:1350000,old:1499000,stock:5,sale:true}];
const $=id=>document.getElementById(id),rp=n=>new Intl.NumberFormat("id-ID",{style:"currency",currency:"IDR",maximumFractionDigits:0}).format(n||0);
function save(){let image=$("image").value;let f=$("file").files[0];let go=data=>{let p={id:+$("id").value||Date.now(),name:$("name").value,cat:$("cat").value,stock:+$("stock").value,old:+$("old").value||0,price:+$("price").value,sale:$("sale").checked,image:data||image||""};let i=ps.findIndex(x=>x.id===p.id);i>=0?ps[i]=p:ps.push(p);localStorage.setItem("mrallin_products",JSON.stringify(ps));resetForm();render();alert("Produk tersimpan.");};if(f){let r=new FileReader();r.onload=()=>go(r.result);r.readAsDataURL(f)}else go()}
function edit(id){let p=ps.find(x=>x.id===id);["id","name","cat","stock","old","price","image"].forEach(k=>$(k).value=p[k]??"");$("sale").checked=!!p.sale}
function del(id){if(confirm("Hapus produk ini?")){ps=ps.filter(p=>p.id!==id);localStorage.setItem("mrallin_products",JSON.stringify(ps));render()}}
function resetForm(){["id","name","stock","old","price","image","start","end"].forEach(k=>$(k).value="");$("sale").checked=false;$("file").value=""}
function render(){$("count").textContent=`(${ps.length})`;$("list").innerHTML=ps.map(p=>`<div class="item"><div><b>${p.name}</b><div class="muted">${p.cat} • Stok ${p.stock} • ${rp(p.price)}</div>${p.sale?'<span class="sale">FLASH SALE</span>':''}</div><div><button onclick="edit(${p.id})">Edit</button> <button class="danger" onclick="del(${p.id})">Hapus</button></div></div>`).join("")}
function saveSettings(){localStorage.setItem("mrallin_settings",JSON.stringify({wa:$("wa").value,addr:$("addr").value}));alert("Pengaturan tersimpan.")}
render();
</script></body></html>
