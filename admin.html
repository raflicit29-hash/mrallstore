<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MR ALL IN Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#090a09;color:#eee;font:14px Arial}.w{max-width:1100px;margin:auto;padding:20px}.panel{background:#10110f;border:1px solid #35362f;border-radius:9px;padding:18px}.grid{display:grid;grid-template-columns:1fr 1.3fr;gap:18px}input,select,textarea{width:100%;padding:11px;margin:6px 0 12px;background:#1b1c19;border:1px solid #3b3c35;color:#fff;border-radius:6px;box-sizing:border-box}button{padding:10px 14px;border:0;border-radius:6px;background:#f4bd43;font-weight:800}.danger{background:#b52e2e;color:#fff}.hidden{display:none}.gold{color:#f4bd43}.item{border:1px solid #333;padding:11px;border-radius:7px;margin:7px 0;display:flex;justify-content:space-between;gap:10px}.muted{color:#999;font-size:12px}.sale{color:#ff6b55;font-weight:900}.preview{max-width:100%;height:100px;object-fit:contain}.login{max-width:450px;margin:80px auto}@media(max-width:750px){.grid{grid-template-columns:1fr}.item{flex-direction:column}}</style></head><body><div class="w"><div id="login" class="panel login"><h2 class="gold">MR ALL IN — ADMIN</h2><p>Login Magic Link khusus <b>raflicit29@gmail.com</b></p><input id="email" value="raflicit29@gmail.com" type="email"><button onclick="login()">📩 Kirim Magic Link</button><p id="msg" class="muted"></p></div><div id="app" class="hidden"><div style="display:flex;justify-content:space-between;align-items:center"><h2 class="gold">MR ALL IN — ADMIN</h2><button class="danger" onclick="out()">Keluar</button></div><div class="grid"><div class="panel"><h3>Produk</h3><input id="id" type="hidden"><label>Nama</label><input id="name"><label>Kategori</label><select id="cat"></select><label>Stok</label><input id="stock" type="number" min="0"><label>Harga normal</label><input id="old" type="number" min="0"><label>Harga jual</label><input id="price" type="number" min="0"><label>Gambar</label><input id="file" type="file" accept="image/*"><img id="prev" class="preview hidden"><label><input id="sale" type="checkbox" style="width:auto"> Flash Sale</label><label>Mulai</label><input id="start" type="datetime-local"><label>Berakhir</label><input id="end" type="datetime-local"><label>Deskripsi</label><textarea id="desc"></textarea><button onclick="save()">💾 Simpan</button> <button class="danger" onclick="resetF()">Batal</button></div><div class="panel"><h3>📦 Daftar Produk</h3><div id="list"></div></div></div></div></div><script>const sb=supabase.createClient('https://sjwmeoqctebgilpvfzmd.supabase.co','sb_publishable_0r10zRJ4HOI9bfOFZJeliw_QIqN-q4T');let ps=[],cs=[];const $=x=>document.getElementById(x);const rp=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(n||0);async function login(){let e=$('email').value.trim().toLowerCase();if(e!=='raflicit29@gmail.com')return $('msg').textContent='Email bukan admin.';let {error}=await sb.auth.signInWithOtp({email:e,options:{emailRedirectTo:location.origin+location.pathname}});$('msg').textContent=error?error.message:'Magic Link dikirim. Cek email.'}async function check(){let {data:{user}}=await sb.auth.getUser();if(!user||user.email.toLowerCase()!=='raflicit29@gmail.com')return;$('login').classList.add('hidden');$('app').classList.remove('hidden');await load()}async function load(){let a=await sb.from('categories').select('*').order('sort_order');if(a.error)return alert(a.error.message);cs=a.data||[];$('cat').innerHTML=cs.map(c=>`<option value="${c.id}">${c.name}</option>`).join('');let b=await sb.from('products').select('*,categories(name)').order('created_at',{ascending:false});if(b.error)return alert(b.error.message);ps=b.data||[];render()}function render(){$('list').innerHTML=ps.map(p=>`<div class="item"><div><b>${p.name}</b><div class="muted">${p.categories?.name||'-'} • Stok ${p.stock} • ${rp(p.price)}</div>${p.flash_sale?'<span class="sale">FLASH SALE</span>':''}</div><div><button onclick="edit(${p.id})">Edit</button> <button class="danger" onclick="del(${p.id})">Hapus</button></div></div>`).join('')}function edit(id){let p=ps.find(x=>x.id===id);$('id').value=p.id;$('name').value=p.name;$('cat').value=p.category_id;$('stock').value=p.stock;$('old').value=p.old_price||'';$('price').value=p.price;$('sale').checked=p.flash_sale;$('start').value=p.promo_start?.slice(0,16)||'';$('end').value=p.promo_end?.slice(0,16)||'';$('desc').value=p.description||''}async function save(){let id=$('id').value,file=$('file').files[0],image='';if(file){let ext=file.name.split('.').pop().toLowerCase(),path=Date.now()+'-'+Math.random().toString(36).slice(2)+'.'+ext;let u=await sb.storage.from('product-images').upload(path,file);if(u.error)return alert(u.error.message);image=sb.storage.from('product-images').getPublicUrl(path).data.publicUrl}else if(id){image=ps.find(p=>p.id==id)?.image_url||''}let data={name:$('name').value.trim(),category_id:+$('cat').value,stock:+$('stock').value,old_price:+$('old').value||null,price:+$('price').value||0,image_url:image,flash_sale:$('sale').checked,promo_start:$('start').value?new Date($('start').value).toISOString():null,promo_end:$('end').value?new Date($('end').value).toISOString():null,description:$('desc').value,active:true};let r=id?await sb.from('products').update(data).eq('id',+id):await sb.from('products').insert(data);if(r.error)return alert(r.error.message);resetF();await load()}async function del(id){if(!confirm('Hapus produk?'))return;let r=await sb.from('products').delete().eq('id',id);if(r.error)alert(r.error.message);else load()}function resetF(){['id','name','stock','old','price','start','end','desc'].forEach(x=>$(x).value='');$('sale').checked=false;$('file').value='';$('prev').classList.add('hidden')}async function out(){await sb.auth.signOut();location.reload()}sb.auth.onAuthStateChange(()=>check());check();</script></body></html>
