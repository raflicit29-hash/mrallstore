<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MR ALL IN — Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
*{box-sizing:border-box}body{margin:0;background:#080908;color:#eee;font-family:Arial,Helvetica,sans-serif}.w{max-width:1150px;margin:auto;padding:18px}a{color:inherit;text-decoration:none}.gold{color:#f4bd43}.head{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid #30312b;padding-bottom:16px}.grid{display:grid;grid-template-columns:1fr 1.3fr;gap:18px;margin-top:18px}.panel{background:#10110f;border:1px solid #35362f;border-radius:12px;padding:18px}input,select,textarea{width:100%;padding:12px;margin:6px 0 14px;background:#1b1c19;border:1px solid #3b3c35;color:#fff;border-radius:7px;outline:0}input:focus,select:focus,textarea:focus{border-color:#f4bd43}button{padding:11px 15px;border:0;border-radius:7px;background:#f4bd43;font-weight:800;cursor:pointer}.danger{background:#b52e2e;color:#fff}.secondary{background:#30312d;color:#fff}.hidden{display:none!important}.login{max-width:460px;margin:70px auto}.muted{color:#999;font-size:12px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.check{display:flex;align-items:center;gap:9px;font-weight:800;margin:5px 0 14px}.check input{width:auto;margin:0}.preview{width:100%;height:180px;object-fit:contain;background:#181916;border:1px solid #333;border-radius:8px;margin:3px 0 10px}.hint{font-size:12px;color:#aaa;margin:-8px 0 12px}.item{display:grid;grid-template-columns:70px 1fr auto;gap:12px;align-items:center;border:1px solid #33352e;border-radius:9px;padding:10px;margin:8px 0}.thumb{width:70px;height:70px;object-fit:contain;background:#181916;border-radius:7px}.sale{color:#ff765e;font-weight:900}.status{display:inline-block;background:#155f45;padding:4px 7px;border-radius:5px;font-size:11px;font-weight:800}.off{background:#573030}.actions{display:flex;gap:6px;flex-wrap:wrap}.toast{position:fixed;right:16px;bottom:16px;background:#1b1c19;border:1px solid #444;padding:12px 15px;border-radius:8px;box-shadow:0 10px 30px #0008;z-index:99}
@media(max-width:780px){.grid{grid-template-columns:1fr}.row{grid-template-columns:1fr}.item{grid-template-columns:58px 1fr}.item .actions{grid-column:1/-1}.thumb{width:58px;height:58px}.head{align-items:flex-start}.head h2{margin:0 0 5px}}
</style></head><body><div class="w">
<div id="login" class="panel login"><h2 class="gold">MR ALL IN — ADMIN</h2><p>Login Magic Link khusus <b>raflicit29@gmail.com</b></p><input id="email" value="raflicit29@gmail.com" type="email"><button onclick="login()">📩 Kirim Magic Link</button><p id="msg" class="muted"></p></div>
<div id="app" class="hidden"><div class="head"><div><h2 class="gold">MR ALL IN — ADMIN</h2><div id="who" class="muted"></div></div><div class="actions"><a href="index.html">← Toko</a><button class="secondary" onclick="out()">Keluar</button></div></div>
<div class="grid"><div class="panel"><h3 id="formTitle">➕ Tambah Produk</h3><input id="id" type="hidden"><label>Nama produk</label><input id="name" placeholder="Contoh: ASUS RTX 3060 12GB"><div class="row"><div><label>Kategori</label><select id="cat"><option>Memuat...</option></select></div><div><label>Stok</label><input id="stock" type="number" min="0" step="1" placeholder="0"></div></div><div class="row"><div><label>Harga normal</label><input id="old" type="number" min="0" step="1000" placeholder="3500000"></div><div><label>Harga jual</label><input id="price" type="number" min="0" step="1000" placeholder="3199000"></div></div>
<label>Foto produk</label><input id="file" type="file" accept="image/jpeg,image/png,image/webp"><div class="hint">Foto akan otomatis diperkecil maksimal 1200px dan dikonversi ke WebP agar ringan. Rasio 1:1 paling bagus.</div><img id="prev" class="preview hidden" alt="Preview">
<label>Flash Sale</label><label class="check"><input id="sale" type="checkbox"> Aktifkan Flash Sale</label><div class="row"><div><label>Mulai</label><input id="start" type="datetime-local"></div><div><label>Berakhir</label><input id="end" type="datetime-local"></div></div><label>Deskripsi</label><textarea id="desc" rows="4" placeholder="Spesifikasi, kondisi, garansi, dll."></textarea><button onclick="save()">💾 Simpan</button> <button class="danger" onclick="resetF()">Batal</button></div>
<div class="panel"><h3>📦 Daftar Produk <span id="count" class="muted"></span></h3><div id="list"></div></div></div></div></div><div id="toast" class="toast hidden"></div>
<script>
const sb=supabase.createClient('https://sjwmeoqctebgilpvfzmd.supabase.co','sb_publishable_0r10zRJ4HOI9bfOFZJeliw_QIqN-q4T');let ps=[],cs=[];const $=x=>document.getElementById(x);const rp=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(n||0);function toast(t){$('toast').textContent=t;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),2500)}
async function login(){let e=$('email').value.trim().toLowerCase();if(e!=='raflicit29@gmail.com')return $('msg').textContent='Email bukan admin.';let {error}=await sb.auth.signInWithOtp({email:e,options:{emailRedirectTo:location.origin+location.pathname}});$('msg').textContent=error?error.message:'Magic Link dikirim. Cek email.'}
async function check(){let {data:{user}}=await sb.auth.getUser();if(!user){$('login').classList.remove('hidden');return}if((user.email||'').toLowerCase()!=='raflicit29@gmail.com'){await sb.auth.signOut();$('msg').textContent='Akun tidak punya akses admin.';return}$('login').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent=user.email;await load()}
async function load(){let a=await sb.from('categories').select('id,name,active,sort_order').eq('active',true).order('sort_order');if(a.error)return toast('Kategori gagal: '+a.error.message);cs=a.data||[];$('cat').innerHTML=cs.map(c=>`<option value="${c.id}">${c.name}</option>`).join('')||'<option value="">Tidak ada kategori</option>';let b=await sb.from('products').select('*,categories(name)').order('created_at',{ascending:false});if(b.error)return toast('Produk gagal: '+b.error.message);ps=b.data||[];render()}
function render(){$('count').textContent=`(${ps.length})`;$('list').innerHTML=ps.length?ps.map(p=>`<div class="item"><div>${p.image_url?`<img class="thumb" src="${p.image_url}" alt="">`:'<div class="thumb" style="display:grid;place-items:center">🖥️</div>'}</div><div><b>${p.name}</b><div class="muted">${p.categories?.name||'-'} • Stok ${p.stock} • ${rp(p.price)}</div>${p.flash_sale?'<span class="sale">🔥 FLASH SALE</span> ':''}<span class="status ${p.active?'':'off'}">${p.active?'Aktif':'Nonaktif'}</span></div><div class="actions"><button onclick="edit(${p.id})">Edit</button><button class="danger" onclick="del(${p.id})">Hapus</button></div></div>`).join(''):'<div class="muted">Belum ada produk.</div>'}
function edit(id){let p=ps.find(x=>x.id===id);if(!p)return;$('formTitle').textContent='✏️ Edit Produk';$('id').value=p.id;$('name').value=p.name;$('cat').value=p.category_id||'';$('stock').value=p.stock;$('old').value=p.old_price||'';$('price').value=p.price;$('sale').checked=!!p.flash_sale;$('start').value=p.promo_start?p.promo_start.slice(0,16):'';$('end').value=p.promo_end?p.promo_end.slice(0,16):'';$('desc').value=p.description||'';if(p.image_url){$('prev').src=p.image_url;$('prev').classList.remove('hidden')}scrollTo({top:0,behavior:'smooth'})}
function compress(file){return new Promise((resolve,reject)=>{let r=new FileReader();r.onload=()=>{let im=new Image();im.onload=()=>{let max=1200,s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*s));c.height=Math.max(1,Math.round(im.height*s));c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(b=>b?resolve(b):reject(new Error('Gagal memproses gambar')),'image/webp',.86)};im.onerror=reject;im.src=r.result};r.onerror=reject;r.readAsDataURL(file)})}
async function save(){let id=$('id').value,file=$('file').files[0],image=id?(ps.find(p=>p.id==id)?.image_url||''):'';if(!$('name').value.trim())return toast('Nama produk wajib diisi.');if(!$('cat').value)return toast('Pilih kategori.');let stock=Math.max(0,parseInt($('stock').value)||0),price=Math.max(0,parseInt($('price').value)||0),old=parseInt($('old').value)||null;if($('sale').checked&&old&&price>=old)return toast('Harga promo harus lebih rendah dari harga normal.');if($('sale').checked&&(!$('start').value||!$('end').value))return toast('Isi mulai dan berakhir Flash Sale.');if($('sale').checked&&new Date($('end').value)<=new Date($('start').value))return toast('Waktu berakhir harus setelah mulai.');if(file){let blob=await compress(file),path=`products/${Date.now()}-${Math.random().toString(36).slice(2)}.webp`;let u=await sb.storage.from('product-images').upload(path,blob,{contentType:'image/webp',upsert:false});if(u.error)return toast('Upload gagal: '+u.error.message);image=sb.storage.from('product-images').getPublicUrl(path).data.publicUrl}let data={name:$('name').value.trim(),category_id:+$('cat').value,stock,old_price:old,price,image_url:image,flash_sale:$('sale').checked,promo_start:$('sale').checked?new Date($('start').value).toISOString():null,promo_end:$('sale').checked?new Date($('end').value).toISOString():null,description:$('desc').value.trim(),active:true};let r=id?await sb.from('products').update(data).eq('id',+id):await sb.from('products').insert(data);if(r.error)return toast('Gagal: '+r.error.message);resetF();await load();toast('Produk berhasil disimpan.');}
async function del(id){if(!confirm('Yakin hapus produk ini?'))return;let r=await sb.from('products').delete().eq('id',id);if(r.error)return toast('Gagal hapus: '+r.error.message);await load();toast('Produk dihapus.')}
function resetF(){$('formTitle').textContent='➕ Tambah Produk';['id','name','stock','old','price','start','end','desc'].forEach(x=>$(x).value='');$('sale').checked=false;$('file').value='';$('prev').classList.add('hidden');if(cs.length)$('cat').value=cs[0].id}
$('file').addEventListener('change',()=>{let f=$('file').files[0];if(f){$('prev').src=URL.createObjectURL(f);$('prev').classList.remove('hidden')}});async function out(){await sb.auth.signOut();location.reload()}sb.auth.onAuthStateChange(()=>check());check();
</script></body></html>
