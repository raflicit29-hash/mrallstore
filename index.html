<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MR ALL IN</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#080908;color:#eee;font:15px Arial}.w{max-width:1200px;margin:auto;padding:18px}.gold{color:#f4bd43}header{border-bottom:1px solid #333}.top{display:flex;gap:18px;align-items:center}.logo{font-size:27px;font-weight:900;color:#f4bd43}.search{flex:1;padding:13px;background:#1b1c19;border:1px solid #333;color:#fff;border-radius:7px}.cats{display:flex;gap:7px;overflow:auto;padding:14px 0}.cats button{padding:10px 15px;border:0;border-radius:6px;background:#222;color:#eee}.cats .on,.btn{background:#f4bd43;color:#111;font-weight:800}.hero{margin:20px 0;padding:42px;border:1px solid #4b3a1e;border-radius:10px;background:radial-gradient(circle at 75%,#6b4a1633,transparent 35%)}h1{font-size:45px;line-height:.95}h1 span{color:#f4bd43}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:13px}.card{border:1px solid #35362f;background:#10110f;border-radius:9px;overflow:hidden;position:relative}.pic{height:170px;display:flex;align-items:center;justify-content:center;background:#181916}.pic img{width:100%;height:100%;object-fit:contain}.body{padding:12px}.price{font-size:19px;font-weight:900;color:#f4bd43;margin:8px 0}.old{text-decoration:line-through;color:#777;font-size:11px}.stock{position:absolute;top:8px;right:8px;background:#0aa66a;padding:5px;border-radius:5px;font-size:11px}.sale{color:#ff6b55;font-weight:900;font-size:11px}.btn{display:block;text-align:center;padding:10px;border-radius:6px;margin-top:9px}.muted{color:#999;font-size:12px}.flash{padding:16px;border:1px solid #5b4620;border-radius:9px;display:flex;justify-content:space-between}.timer{font-size:21px;font-weight:900;color:#f4bd43}@media(max-width:900px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:550px){.search{display:none}.grid{grid-template-columns:repeat(2,1fr)}.pic{height:130px}h1{font-size:33px}.hero{padding:25px}}</style></head><body><header><div class="w top"><div class="logo">MR ALL IN</div><input id="q" class="search" placeholder="Cari produk..."><a class="gold" href="admin.html">⚙ Admin</a></div><div class="w"><div id="cats" class="cats"></div></div></header><main class="w"><section class="hero"><h1>UPGRADE<br>GAME <span>WORK</span> CREATE</h1><p>Performa tanpa batas — hardware gaming, creator, office & profesional.</p></section><section id="flash"><h2>🔥 Flash Sale</h2><div class="flash"><span>Promo terbatas</span><b id="timer" class="timer">--:--:--</b></div></section><h2>Produk Terbaru</h2><div id="products" class="grid">Memuat...</div></main><script>const sb=supabase.createClient('https://sjwmeoqctebgilpvfzmd.supabase.co','sb_publishable_0r10zRJ4HOI9bfOFZJeliw_QIqN-q4T');let ps=[],active='Semua';const cats=['Semua','VGA','Processor','Motherboard','RAM','SSD','HDD','PSU','Casing','Monitor','Aksesoris','Paket PC'];const rp=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(n||0);function catUI(){document.getElementById('cats').innerHTML=cats.map(c=>`<button class="${c===active?'on':''}" onclick="active='${c}';catUI();render()">${c}</button>`).join('')}function sale(p){let n=Date.now();return p.flash_sale&&p.promo_start&&p.promo_end&&new Date(p.promo_start).getTime()<=n&&n<new Date(p.promo_end).getTime()}function render(){let q=document.getElementById('q').value.toLowerCase();let a=ps.filter(p=>(active==='Semua'||p.categories?.name===active)&&p.name.toLowerCase().includes(q));document.getElementById('products').innerHTML=a.length?a.map(p=>{let s=sale(p);let price=p.price,old=s?p.old_price:null;return `<article class="card"><span class="stock">Stok: ${p.stock}</span><div class="pic">${p.image_url?`<img src="${p.image_url}">`:'🖥️'}</div><div class="body">${s?'<div class="sale">FLASH SALE</div>':''}<b>${p.name}</b><div class="muted">${p.categories?.name||''}</div><div class="price">${rp(price)} ${old?`<span class="old">${rp(old)}</span>`:''}</div><div class="muted">${p.stock<=2?'⚠️ Hampir habis':'✓ Tersedia'}</div><a class="btn" href="https://wa.me/6281330053178?text=${encodeURIComponent('Halo MR ALL IN, saya mau tanya '+p.name+' - '+rp(price))}">💬 Tanya via WhatsApp</a></div></article>`}).join(''):'<div class="muted">Produk tidak ditemukan.</div>';let sales=ps.filter(sale);document.getElementById('flash').style.display=sales.length?'block':'none';window.ends=sales.map(p=>new Date(p.promo_end).getTime())}async function load(){catUI();let {data,error}=await sb.from('products').select('*,categories(name)').eq('active',true).order('created_at',{ascending:false});if(error){document.getElementById('products').textContent='Gagal memuat produk: '+error.message;return}ps=data||[];render()}document.getElementById('q').addEventListener('input',render);window.ends=[];setInterval(()=>{if(!ends.length)return;let d=Math.max(0,Math.min(...ends)-Date.now()),h=Math.floor(d/36e5),m=Math.floor(d%36e5/6e4),s=Math.floor(d%6e4/1e3);document.getElementById('timer').textContent=`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;if(!d)load()},1000);load();</script></body></html>
